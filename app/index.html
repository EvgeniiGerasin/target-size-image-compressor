<!DOCTYPE html>
<html lang="ru">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Сжать изображения</title>
  <link rel="icon" href="images/icon.png" type="image/x-icon">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style/styles.css">
  <!-- Подключаем JSZip и FileSaver -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
</head>

<body>
  <header>
    <h1>Сжать изображения</h1>
  </header>

  <div class="card">
    <label for="imageInput">Выберите изображения:</label>
    <div class="file-upload-wrapper">
      <input type="file" id="imageInput" multiple accept="image/*" />
      <button class="upload-btn" onclick="document.getElementById('imageInput').click()">
        📎 Прикрепить файлы
      </button>
    </div>

    <label for="targetSize">Целевой размер (КБ):</label>
    <input type="number" id="targetSize" value="300" min="10" />

    <button id="compressBtn" disabled>Сжать изображения</button>
    <button id="downloadAllBtn">Скачать все</button>

    <div id="result"></div>

    <div class="copyright">
      © Евгений Герасин<br>
      <div style="color: #ff0000;">26.1</div>
      <a href="https://github.com/EvgeniiGerasin/target-size-image-compressor" target="_blank" rel="noopener noreferrer">
      <img src="images/github.png" alt="GitHub">
      </a>
    </div>
  </div>

  <script src="scripts/script.js"></script>
</body>

</html>
